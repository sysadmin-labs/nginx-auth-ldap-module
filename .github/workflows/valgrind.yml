name: Valgrind

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valgrind:
    name: run the suite under valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # slow, and a pull request is already covered by Build & Test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          packages: libldap2-dev

      - name: Build nginx
        run: |
          . .github/versions.env
          ci/build.sh "$NGINX_VERSION" "$HOME/nginx"

      - name: Run the test suite under valgrind
        run: |
          set -o pipefail
          # Test::Nginx runs valgrind with -q, so a clean run says nothing
          # at all and cannot be told apart from a run that never happened.
          # The step below is the one that proves valgrind was there.
          TEST_NGINX_USE_VALGRIND=1 TEST_NGINX_NO_SHUFFLE=1 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" \
            prove -r t/ 2>&1 | tee valgrind.log

      - name: Run the driver under valgrind
        run: |
          # t/ reaches the configuration parser; this walks a request
          # through the module, which is where a leak per request would be.
          AUTH_WRAP="valgrind --leak-check=full --show-leak-kinds=definite,indirect,possible --num-callers=30 --error-exitcode=0 --suppressions=$PWD/valgrind.suppress --log-file=$PWD/vg-auth.log" \
            ci/auth.sh "$HOME/nginx/sbin/nginx"
          # valgrind writes a summary whether or not it found anything, so
          # its absence means valgrind did not run and the gate is blind
          grep -q "ERROR SUMMARY" vg-auth.log || {
            echo "valgrind wrote no summary, so it did not run" >&2
            exit 1
          }
          # And the summary is the verdict: counting on a list of phrases
          # lets through every kind of finding that is not on the list.
          grep -q "ERROR SUMMARY: 0 errors" vg-auth.log || {
            echo "valgrind counted findings of its own:" >&2
            grep -E "ERROR SUMMARY|lost: " vg-auth.log >&2
            exit 1
          }
          sed -n '1,200p' vg-auth.log
          cat vg-auth.log >> valgrind.log

      - name: No findings allowed
        run: |
          # "are definitely lost" is how a loss record reads; the summary at
          # the end of a run says "definitely lost: 0 bytes", so matching the
          # words alone would turn a clean run red.
          if grep -niE "invalid read|invalid write|uninitialised|uninitialized value|conditional jump|mismatched free" valgrind.log ||
             grep -nE "are (definitely|indirectly) lost" valgrind.log; then
            echo "valgrind reported the lines above" >&2
            exit 1
          fi
          echo "valgrind found nothing"
