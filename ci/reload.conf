# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $SRC, $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The connections of this module are made when a worker starts, so every
# reload builds a new pool and the old one has to go away with its cycle.
# The probe authenticates for real, which is the only answer that proves the
# pool of the new generation works.

RELOAD_LDAP_PORT=$("$SRC/ci/ldap.sh" "${RELOAD_LDAP_PORT:-13891}")

mkdir -p "$WORK/html"
echo in > "$WORK/html/probe.txt"
chmod 644 "$WORK/html/probe.txt"

RELOAD_HTTP="
    ldap_server reload {
        url ldap://127.0.0.1:$RELOAD_LDAP_PORT/ou=people,dc=test,dc=local?uid?sub?(objectClass=inetOrgPerson);
        binddn \"cn=admin,dc=test,dc=local\";
        binddn_passwd secret;
        require valid_user;
        connections 2;
    }"

RELOAD_SERVER="
        root $WORK/html;

        location = /probe.txt {
            auth_ldap \"Reload\";
            auth_ldap_servers reload;
        }"

RELOAD_EXPECT='in'

reload_probe() {
	curl -s -u alice:alicepw --max-time 5 "http://127.0.0.1:$PORT/probe.txt"
}
